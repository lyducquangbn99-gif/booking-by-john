  <text x="120" y="245" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#132238">ICS2: NO MRN, NO LOAD</text>
  <text x="120" y="305" font-family="Arial, sans-serif" font-size="30" fill="#46566d">Carrier checkpoint effective 30 September 2026</text>
  <rect x="120" y="370" width="370" height="92" rx="16" fill="#eef2f7"/>
