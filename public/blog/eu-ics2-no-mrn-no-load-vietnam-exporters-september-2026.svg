<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">EU ICS2 No MRN, No Load</title>
  <desc id="desc">Documentation checkpoint illustration for Vietnam exports moving to or through the European Union</desc>
  <rect width="1200" height="630" fill="#f5f7fa"/>
  <rect x="72" y="72" width="1056" height="486" rx="28" fill="#ffffff" stroke="#d7dde5" stroke-width="3"/>
